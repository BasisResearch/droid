services:
  control_server:
    image: droid_nuc:panda
    build:
      context: ../../
      dockerfile: .docker/nuc/Dockerfile.nuc
    volumes:
      # machine-specific runtime parameters (sudo password etc.); everything
      # else the server needs is baked into the image
      - ../../droid/misc/parameters.py:/app/droid/misc/parameters.py
    # host networking: the laptop connects to the zerorpc server on :4242 and
    # polymetis gRPC on :50051, and libfranka talks to the robot at its static IP
    network_mode: "host"
    # real-time scheduling for the 1kHz libfranka control loop
    privileged: true
    ulimits:
      rtprio: 99
      memlock: 102400
    restart: always
