services:
  control_server:
    image: droid_nuc:panda
    build:
      context: ../../
      dockerfile: .docker/nuc/Dockerfile.nuc
    volumes:
      # machine-specific runtime parameters (sudo password etc.); everything
      # else the server needs is baked into the image
      - ../../droid/misc/parameters.py:/app/droid/misc/parameters.py:ro,Z
    # host networking: the laptop connects to the zerorpc server on :4242 and
    # polymetis gRPC on :50051, and libfranka talks to the robot at its static IP
    network_mode: "host"
    # real-time scheduling for the 1kHz libfranka control loop: SCHED_FIFO
    # needs SYS_NICE + rtprio; mlockall needs unlimited memlock (the process
    # locks >1GB with libtorch loaded); the RT setup writes /dev/cpu_dma_latency
    # to pin CPU C-states — the only device node the stack touches
    cap_add:
      - SYS_NICE
    devices:
      - /dev/cpu_dma_latency
    # rootless-style isolation; needs a "containers" range in /etc/subuid+gid
    userns_mode: "auto"
    ulimits:
      rtprio: 99
      memlock: -1
    restart: always
