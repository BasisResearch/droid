[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "droid"
authors = [
    {name = "Alexander Khazatsky "}
]
description = "Distributed Robot Interaction Dataset"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["robotics"]
dependencies = [
    "boto3",
    "customtkinter",
    "gym",
    "h5py",
    "imageio",
    "matplotlib",
    "open3d",
    "opencv-contrib-python-headless==4.6.0.66",
    "Pillow",
    "protobuf==3.20.1",
    "psutil",
    "pyrallis",
    "scipy",
    "tqdm",
    "zerorpc",
    "numpy<2",
]

[project.optional-dependencies]
dev = [
    "black[jupyter]",
    "ipython",
    "pre-commit",
    "ruff",
]
postprocessing = [
    "scikit-image",
]
# nothing in droid imports these directly; the laptop Dockerfiles install the
# same set with pip --no-deps
dm-robotics = [
    "dm-robotics-moma==0.5.0",
    "dm-robotics-transformations==0.5.0",
    "dm-robotics-agentflow==0.5.0",
    "dm-robotics-geometry==0.5.0",
    "dm-robotics-manipulation==0.5.0",
    "dm-robotics-controllers==0.5.0",
]

[project.urls]
homepage = "https://github.com/droid-dataset/droid"
repository = "https://github.com/droid-dataset/droid"
documentation = "https://github.com/droid-dataset/droid"

[tool.black]
line-length = 121
target-version = ["py37", "py38", "py39", "py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py38"
select = ["A", "B", "C90", "E", "F", "I", "RUF", "W"]
ignore = ["F405", "B006", "C901", "F403", "E722"]
[tool.ruff.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.isort]
profile = "black"
line_length = 121
skip = ["__init__.py"]
filter_files = true
py_version = "all"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["cache"]
